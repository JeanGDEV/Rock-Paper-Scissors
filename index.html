<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container-buttons">
        <button class="rock-btn">Rock</button>
        <button class="paper-btn">Paper</button>
        <button class="scissors-btn">Scissors</button>
    </div>
    <div id="container-results">
        <p>Get 5 points to win</p>
        <p id="result"></p>
        <p id="winner"></p>
        <div class="count">
            <p>
                Human: <span id="human-score">0</span>
            </p>
            <p>
                Computer: <span id="computer-score">0</span>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
